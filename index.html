<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="A rotatable 3D map of a London Tube train and station for ideating on how commuters could offer or ask for a seat.">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px/1.5 system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}*{box-sizing:border-box}</style>
<title>Tube Seat Ideation Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Overpass:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
</head>
<body>
<style>
/* Layout: one-screen tool. Rotatable sectional model of a deep-level Tube station on the left, ideation panel on the right; stacks on phones. */
:root{
  --paper:#EEF0EC; --surface:#FFFFFF; --chip:#E4E7E1; --ink:#15181D; --muted:#5A616B; --line:#D3D7CF;
  --accent:#E3A214; --accent-ink:#2E2000; --stage:#0B0E13; --dmx-bg:#111111; --dmx:#F5A623;
  --offer:#1C7E66; --request:#B8433A; --both:#5452C9; --ambient:#6B6F76;
  --display:"Overpass","Segoe UI",system-ui,sans-serif; --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#111418; --surface:#181C21; --chip:#23282F; --ink:#ECEDE9; --muted:#9BA2AC; --line:#2C3139;
  --accent:#F0B23A; --accent-ink:#241900; --offer:#3DB58F; --request:#E26A5E; --both:#8C8AF2; --ambient:#9AA0A8; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#111418; --surface:#181C21; --chip:#23282F; --ink:#ECEDE9; --muted:#9BA2AC; --line:#2C3139;
  --accent:#F0B23A; --accent-ink:#241900; --offer:#3DB58F; --request:#E26A5E; --both:#8C8AF2; --ambient:#9AA0A8; color-scheme:dark;
}
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;overflow:hidden}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{height:100%;display:grid;grid-template-rows:auto 1fr}
header.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-size:12.5px}
.bar .spacer{flex:1}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--paper)}
.seg button{border:0;background:transparent;padding:6px 11px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.toggle{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{accent-color:var(--accent)}

.main{display:grid;grid-template-columns:minmax(0,1fr) 390px;min-height:0}
.stage{position:relative;background:var(--stage);min-height:0;overflow:hidden;touch-action:none}
.stage canvas{display:block;width:100%;height:100%;cursor:grab}
.stage canvas.hovering{cursor:pointer}
.pins{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mk{position:absolute;left:0;top:0;pointer-events:auto;border:0;background:none;padding:0;cursor:pointer;display:flex;align-items:center;gap:6px;transform:translate(-9999px,0)}
.mk:not(.has){display:none}
.pins.show-empty .mk:not(.has),.mk.sel{display:flex}
.mk .dot{width:12px;height:12px;border-radius:50%;background:rgba(10,13,18,.85);border:2px solid #8E97A3;display:grid;place-items:center;flex:none}
.mk .dot b{display:none;font:700 11px/1 var(--mono);color:#F5A623;font-variant-numeric:tabular-nums}
.mk .lbl{display:none;background:rgba(10,13,18,.9);color:#EDEFF2;font:500 11.5px/1.25 var(--body);padding:3px 8px;border-radius:4px;white-space:nowrap}
.mk .lbl em{font-style:normal;font-family:var(--mono);opacity:.65;margin-right:5px}
.mk:not(.has):hover .lbl,.mk.sel:not(.has) .lbl{display:block}
.mk.has{background:#F5A623;border-radius:999px;padding:2px 9px 2px 2px;gap:6px;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.mk.has .dot{width:20px;height:20px;background:#14171C;border:0}
.mk.has .dot b{display:block}
.mk.has .lbl{display:block;background:none;color:#1A1200;padding:0;font-weight:600}
.mk.sel{box-shadow:0 0 0 3px #FFFFFF,0 2px 10px rgba(0,0,0,.5);z-index:1000}
.mk.sel:not(.has) .dot{border-color:#F5A623;transform:scale(1.3)}
.mk .stem{position:absolute;left:11px;top:50%;width:2px;background:#F5A623;pointer-events:none;display:none;z-index:0}
.mk .dot{position:relative;z-index:1}
.mk .lbl{position:relative;z-index:1}
.mk.has .stem::after{content:"";position:absolute;left:-3px;bottom:-4px;width:8px;height:8px;border-radius:50%;background:#F5A623;box-shadow:0 0 0 2px rgba(20,23,28,.8)}
.mk.dim{opacity:.55}
.mk.dim:hover,.mk.sel{opacity:1}
.mk.off,.pins.show-empty .mk.off{display:none}
.legend{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:12px;display:flex;flex-wrap:wrap;gap:6px;pointer-events:auto}
.legend .sum{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.16);background:rgba(11,14,19,.82);color:#D6DADF;border-radius:999px;padding:5px 12px;font-size:12px;font-variant-numeric:tabular-nums}
.legend .sum b{color:#F5A623;font-family:var(--mono)}
.legend .sum i{width:10px;height:10px;border-radius:50%;background:#F5A623;box-shadow:0 0 0 2px rgba(245,166,35,.3)}
.nav{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:auto;max-width:calc(100% - 24px)}
.nav .grp{display:flex;background:rgba(11,14,19,.85);border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden}
.nav button{border:0;background:transparent;color:#E3E6EA;min-width:36px;height:34px;padding:0 10px;font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none}
.nav button+button{border-left:1px solid rgba(255,255,255,.12)}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button:active,.nav button.held{background:rgba(245,166,35,.25)}
.nav button[aria-pressed="true"]{background:#F5A623;color:#1A1200}
.nav svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.hint{position:absolute;right:12px;bottom:12px;color:#7F8895;font-size:11.5px;text-align:right;pointer-events:none;max-width:40%}
.hover-tip{position:absolute;pointer-events:none;background:#F5F6F3;color:#15181D;font-size:12px;font-weight:500;padding:3px 8px;border-radius:4px;transform:translate(14px,14px);white-space:nowrap}

aside.panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0;min-width:0}
.ptabs{display:flex;gap:4px;padding:10px 12px 0;border-bottom:1px solid var(--line)}
.ptabs button{border:0;background:transparent;padding:8px 12px 10px;font-weight:600;font-size:13.5px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:inline-flex;align-items:center;gap:7px}
.ptabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.ptabs .n{font:600 11px/1 var(--mono);background:var(--chip);color:var(--ink);border-radius:999px;padding:3px 7px;font-variant-numeric:tabular-nums}
.scroll{overflow-y:auto;flex:1;min-height:0;padding:16px 16px 24px;display:flex;flex-direction:column;gap:16px}
.status{font-size:11.5px;color:var(--muted);padding:8px 16px;border-top:1px solid var(--line);display:flex;align-items:center;gap:7px;min-height:34px}
.status .dotc{width:7px;height:7px;border-radius:50%;background:var(--ambient);flex:none}
.status .dotc.live{background:var(--offer)}
.status.flash{color:var(--ink);font-weight:500}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-weight:600;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--paper)}
.btn.danger{color:var(--request)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg,.icon-btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn{border:0;background:transparent;color:var(--muted);width:30px;height:30px;border-radius:7px;display:inline-grid;place-items:center;cursor:pointer}
.icon-btn:hover,.icon-btn[aria-expanded="true"]{background:var(--paper);color:var(--ink)}
.field{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);width:100%;font-size:13px}
.field:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
select.field{padding:6px 8px;width:auto}
.label{font-size:11.5px;font-weight:600;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}

/* avenue list */
.search{position:relative}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round}
.search .field{padding-left:32px}
.lede{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.zone{display:flex;flex-direction:column}
.zone h3{margin:0 0 4px;display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.zone h3 i{width:8px;height:8px;border-radius:50%}
.zone h3 span{margin-left:auto;font-family:var(--mono);letter-spacing:0;text-transform:none;font-weight:500}
.avrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:7px;cursor:pointer;font-size:13.5px}
.avrow:hover{background:var(--paper)}
.avrow .nm{flex:1;min-width:0}
.avrow .code{font:500 11px/1 var(--mono);color:var(--muted);width:28px;flex:none}
.avrow .cnt{font:600 11px/1 var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:4px 8px;font-variant-numeric:tabular-nums}
.avrow .go{width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2;opacity:0}
.avrow:hover .go{opacity:1}
.avrow.nohits .nm{color:var(--muted)}
.none{color:var(--muted);font-size:13px;padding:8px}

/* avenue detail */
.crumb{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:-6px -6px 0}
.dmx{background:var(--dmx-bg);color:var(--dmx);border-radius:5px;padding:3px 8px;font:600 11px/1.4 var(--mono);letter-spacing:.08em;background-image:radial-gradient(rgba(255,255,255,.05) 1px,transparent 1.2px);background-size:3px 3px}
.av-head{display:flex;flex-direction:column;gap:6px}
.av-title{font-family:var(--display);font-weight:800;font-size:23px;line-height:1.15;margin:0;text-wrap:balance}
.zone-tag{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.zone-tag i{width:8px;height:8px;border-radius:50%}
.question{margin:0;color:var(--muted);font-size:13.5px;max-width:62ch}
.question b{color:var(--ink);font-weight:600}

/* composer */
.composer{border:1px solid var(--line);border-radius:12px;background:var(--paper);display:flex;flex-direction:column;transition:box-shadow .15s}
.composer.open{box-shadow:0 0 0 2px var(--accent)}
.composer textarea{border:0;background:transparent;resize:none;padding:11px 12px;min-height:42px;line-height:1.45;font-size:13.5px;width:100%}
.composer.open textarea{min-height:84px;resize:vertical}
.composer textarea:focus{outline:none}
.composer .opts{display:none;flex-direction:column;gap:10px;padding:0 12px 12px}
.composer.open .opts{display:flex}
.who{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.who button{border:0;background:transparent;padding:6px 4px;font-size:12px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:5px}
.who button+button{border-left:1px solid var(--line)}
.who button i{width:7px;height:7px;border-radius:50%}
.who button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
details.more summary{cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
details.more summary::-webkit-details-marker{display:none}
details.more summary svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2.4;transition:transform .15s}
details.more[open] summary svg{transform:rotate(90deg)}
details.more .inner{display:flex;flex-direction:column;gap:10px;padding-top:10px}
.inline-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inline-row .field{flex:1;min-width:0;width:auto;padding:6px 9px;font-size:12.5px}
.composer .foot{display:flex;justify-content:flex-end;gap:8px}
.chip.link-on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* ideas */
.sec-h{display:flex;align-items:baseline;justify-content:space-between;margin:4px 0 -6px}
.sec-h h3{margin:0;font-size:13px;font-weight:600}
.sec-h span{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.idea{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 10px 10px 8px;background:var(--surface)}
.idea.top1{border-color:var(--accent)}
.idea .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.idea p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:13.5px;line-height:1.45}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center;font-size:12px;color:var(--muted)}
.who-l{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.who-l i{width:7px;height:7px;border-radius:50%}
.tagtxt{color:var(--muted)}
.also{display:inline}
.also button{border:0;background:none;padding:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:2px;cursor:pointer;font-size:12px}
.also button:hover{text-decoration-color:var(--accent)}
.badge{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;border-radius:4px;padding:1px 5px}
.badge.top{background:var(--accent);color:var(--accent-ink)}
.badge.ex{border:1px dashed var(--line);color:var(--muted)}
.vote{flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;width:40px;padding:5px 0;border:1px solid var(--line);border-radius:8px;background:var(--paper);cursor:pointer;line-height:1.1;color:var(--ink)}
.vote svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.vote b{font:600 13px/1.15 var(--mono);font-variant-numeric:tabular-nums}
.vote:hover{border-color:var(--accent)}
.vote[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.vote[aria-pressed="true"] svg{fill:currentColor}
.vote:disabled{cursor:not-allowed;opacity:.55}
.idea .menu{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none}
.idea .acts{display:flex;gap:6px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px;padding-top:8px}
.empty{border:1px dashed var(--line);border-radius:10px;padding:16px;color:var(--muted);font-size:13px;text-align:center}

/* ideas tab toolbar */
.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.toolbar .grow{flex:1}
.filters{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.filters .row{display:flex;flex-direction:column;gap:6px}
.fcount{font:600 10.5px/1 var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:3px 6px}
.count-line{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.mdout{width:100%;min-height:150px;font:12px/1.4 var(--mono)}
.loading[hidden]{display:none}
.loading{position:absolute;inset:0;display:grid;place-items:center;color:#8B94A0;font-size:13px;pointer-events:none}

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto;min-height:100%}
  .main{grid-template-columns:1fr}
  .stage{height:60vh;height:60dvh}
  aside.panel{border-left:0;border-top:1px solid var(--line)}
  .scroll{overflow:visible}
  .brand span{display:none}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">
  <header class="bar">
    <div class="brand"><h1>Tube Seat Ideation Map</h1><span>Invisible needs · offering and asking for a seat</span></div>
    <div class="spacer"></div>
    <div class="seg" role="group" aria-label="Camera view">
      <button type="button" data-view="overview" aria-pressed="true">Overview</button>
      <button type="button" data-view="carriage" aria-pressed="false">Inside car</button>
      <button type="button" data-view="platform" aria-pressed="false">Platform</button>
      <button type="button" data-view="station" aria-pressed="false">Escalator &amp; gates</button>
    </div>
    <label class="toggle"><input type="checkbox" id="opt-cutaway" checked> Cutaway</label>
    <label class="toggle"><input type="checkbox" id="opt-empty"> Show empty avenues</label>
  </header>
  <div class="main">
    <div class="stage" id="stage">
      <div class="loading" id="loading">Building the station…</div>
      <div class="pins" id="pins"></div>
      <div class="legend" id="legend"></div>
      <div class="nav" id="nav">
        <div class="grp" role="group" aria-label="What dragging does">
          <button type="button" id="mode-move" aria-pressed="true" title="Drag to move around"><svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/></svg>Move</button>
          <button type="button" id="mode-rotate" aria-pressed="false" title="Drag to rotate the view"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>Rotate</button>
        </div>
        <div class="grp" role="group" aria-label="Move along the station">
          <button type="button" data-hold="left" title="Move left (A or ←)" aria-label="Move left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
          <button type="button" data-hold="fwd" title="Move forward (W or ↑)" aria-label="Move forward"><svg viewBox="0 0 24 24"><path d="M5 15l7-7 7 7"/></svg></button>
          <button type="button" data-hold="back" title="Move back (S or ↓)" aria-label="Move back"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
          <button type="button" data-hold="right" title="Move right (D or →)" aria-label="Move right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
        </div>
        <div class="grp" role="group" aria-label="Turn and zoom">
          <button type="button" data-hold="turnL" title="Turn left (Q)" aria-label="Turn left"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.6M4 4v5h5"/></svg></button>
          <button type="button" data-hold="turnR" title="Turn right (E)" aria-label="Turn right"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg></button>
          <button type="button" data-hold="in" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<script>
(function(){
"use strict";
/* ================= Avenues ================= */
const ZONES = {

  person:{label:"On the person", color:"#D27BCB"},
  station:{label:"Station", color:"#5FBF8A"}
};
const AVENUES = [
  ["C01","carriage","Standard seats","Seated riders are the ones who can give. How might a seat let someone signal “happy to move” before anyone has to speak?"],
  ["C02","carriage","Priority seats","Signs already say who these seats are for. Where does that break down when the need can’t be seen?"],

  ["C06","carriage","Doors & thresholds","Boarding is when seats get claimed. What could happen at the threshold, before people settle?"],
  ["C07","carriage","Next-station display","Everyone glances up here. Could it pass on a request without naming who made it?"],
  ["C08","carriage","Ad cove & line diagram","Riders read the cove to avoid eye contact. Could it invite contact instead?"],

  ["C10","carriage","Floor","Floor markings decide where people stand. Could they decide who stands near the priority seats?"],
  ["C11","carriage","Wheelchair bay","A space defined by need. What can the other zones learn from how this one is marked?"],
  ["C12","carriage","Passenger alarm","The formal help channel is kept for emergencies. Is there room for a lower-stakes one?"],
  ["C13","carriage","Car-end door","The car ends often have spare seats and little attention."],
  ["P01","person","Badge","TfL already offers a “Please offer me a seat” badge. Why do riders still hesitate to wear it, or act on one?"],
  ["P02","person","Phone","Most riders are looking at a phone. Could the screen do the asking, or the offering?"],
  ["P03","person","Bag & belongings","Bags occupy seats and hint at intent: getting off soon, or settled for the ride."],
  ["P04","person","Gaze & posture","Body language is the channel already in use. What makes it so easy to misread?"],
  ["S01","station","Platform edge","Riders bunch along the yellow line before boarding. The seat negotiation could start here."],
  ["S02","station","Platform benches","Some riders wait seated. The need often begins before the train arrives."],
  ["S03","station","Train indicator","A shared screen everyone checks. Could it show which car has a free priority seat?"],
  ["S04","station","Door waiting zones","Where people wait decides who boards first, and who gets a seat."],
  ["S05","station","Cross-track posters","Long dwell time and captive attention, facing riders across the track."],
  ["S06","station","Help point","Staff can help, but routing a seat request through staff feels heavy. Could it feel lighter?"],
  ["S07","station","Ticket gates","Every rider taps through. A private moment to declare a need?"],
  ["S08","station","Escalator","A slow, single-file ride with time to read before reaching the platform."],
  ["S09","station","Announcements","Announcements address everyone at once, so nobody feels singled out."]
].map(a=>({code:a[0],zone:a[1],name:a[2],prompt:a[3],meshes:[],anchorMesh:null}));
const AV = Object.fromEntries(AVENUES.map(a=>[a.code,a]));
const DIRS = [["offer","Offering"],["request","Requesting"],["both","Both"],["ambient","Ambient / norm"]];
const DIRLABEL = Object.fromEntries(DIRS);
const PRESET_TAGS = ["Wearable","Ambient","Digital","Physical","Signage","Social norm","Staff-led","Low-cost","Anonymous"];

/* ================= Storage =================
   Three backends share one API shape (collection().onSnapshot, doc().set/delete):
   1. claude.ai artifact database (when opened on claude.ai)
   2. Firebase Firestore (when a config is filled in below, e.g. on GitHub Pages)
   3. This browser only (fallback)                                               */
const LS_KEY = "tube-seat-ideas-v1", LS_VOTES = "tube-seat-votes-v1";
const store = { mode:"starting", ideas:[], db:null, loaded:false, error:null, uid:null, votes:{}, mine:new Set(), votesReady:false, votesError:false };
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function cleanIdea(id, d){
  if(!d || typeof d.text!=="string") return null;
  const avs = Array.isArray(d.avenues) ? d.avenues.filter(c=>typeof c==="string" && AV[c]) : [];
  if(!avs.length) return null;
  return { id, text:d.text.slice(0,4000), avenues:avs, dir: DIRLABEL[d.dir]?d.dir:"ambient",
    tags: Array.isArray(d.tags)? d.tags.filter(t=>typeof t==="string").slice(0,20).map(t=>t.slice(0,40)) : [],
    createdAt: Number(d.createdAt)||0, updatedAt:Number(d.updatedAt)||0, example: d.example===true,
    createdBy: typeof d.createdBy==="string" ? d.createdBy : null };
}
function firebaseConfig(){
  try{ const el=document.getElementById("firebase-config"); const c=el && JSON.parse(el.textContent||"{}"); return c && c.apiKey && c.projectId ? c : null; }catch(e){ return null; }
}
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=()=>rej(new Error("load "+src)); document.head.appendChild(s); }); }
async function connectFirebase(cfg){
  const V="10.12.2", base="https://www.gstatic.com/firebasejs/"+V+"/";
  await loadScript(base+"firebase-app-compat.js");
  await Promise.all([loadScript(base+"firebase-auth-compat.js"), loadScript(base+"firebase-firestore-compat.js")]);
  const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(cfg);
  const cred = await firebase.auth(app).signInAnonymously();
  return { db: firebase.firestore(app), uid: cred.user ? cred.user.uid : null };
}
function useLocal(){
  store.mode="local";
  try{ const raw = JSON.parse(lsGet(LS_KEY)||"[]"); store.ideas = raw.map(r=>cleanIdea(r.id,r)).filter(Boolean); }catch(e){ store.ideas=[]; }
  try{ store.mine = new Set(JSON.parse(lsGet(LS_VOTES)||"[]").filter(x=>typeof x==="string")); }catch(e){ store.mine=new Set(); }
  store.votes = {}; store.mine.forEach(id=>store.votes[id]=1); store.votesReady=true;
  store.loaded=true; renderAll();
}
function persistLocal(){ lsSet(LS_KEY, JSON.stringify(store.ideas)); }
async function initStore(){
  let db=null;
  if(window.claude && typeof window.claude.use==="function"){
    try{ db = await window.claude.use("db"); }catch(e){ db=null; }
    if(db){ store.mode="db"; try{ const user = await window.claude.use("user"); store.uid = user ? await user.id() : null; }catch(e){ store.uid=null; } }
  }
  if(!db){ const cfg=firebaseConfig();
    if(cfg){ store.mode="connecting"; renderStatus();
      try{ const f = await connectFirebase(cfg); db=f.db; store.uid=f.uid; store.mode="firebase"; }
      catch(e){ console.warn(e); store.error="Couldn’t connect to the shared board. Ideas you add now stay in this browser."; db=null; } } }
  if(!db){ useLocal(); return; }
  store.db = db; renderStatus();
  const timer = setTimeout(()=>{ if(!store.loaded){ store.error="The board is taking a while to load. Ideas you add will appear once it connects."; renderAll(); } },10000);
  db.collection("ideas").onSnapshot(snap=>{
    clearTimeout(timer); store.error=null;
    store.ideas = snap.docs.map(d=>cleanIdea(d.id,d.data())).filter(Boolean);
    store.loaded=true; renderAll();
  }, err=>{ clearTimeout(timer); store.error="Couldn’t reach the board ("+(err&&err.code||"error")+"). Reload the page to try again."; renderAll(); });
  db.collection("votes").onSnapshot(snap=>{
    const counts={}; let mine=null;
    snap.docs.forEach(d=>{ const v=d.data()||{}; const list=Array.isArray(v.ideas)?[...new Set(v.ideas.filter(x=>typeof x==="string"))]:[];
      list.forEach(id=>counts[id]=(counts[id]||0)+1); if(d.id===store.uid) mine=list; });
    store.votes=counts; if(!pendingVote) store.mine=new Set(mine||[]); store.votesReady=true; renderAll();
  }, err=>{ store.votesReady=true; store.votesError=true; renderAll(); });
}
const shared = ()=> store.mode==="db" || store.mode==="firebase";
const denied = e => e && (e.code==="permission_denied" || e.code==="permission-denied");
let pendingVote=false;
function voteCount(id){ return store.votes[id]||0; }
function canVote(){ return store.mode==="local" || (shared() && !!store.uid && !store.votesError); }
function canModify(i){ return store.mode!=="firebase" || (!!store.uid && i.createdBy===store.uid); }
async function toggleVote(id){
  if(!canVote()){ flash(store.mode==="db" ? "Sign in with contributor access to vote." : "Voting isn’t ready yet."); return; }
  const had = store.mine.has(id), next = new Set(store.mine);
  had ? next.delete(id) : next.add(id);
  const live = new Set(store.ideas.map(i=>i.id)); [...next].forEach(x=>{ if(!live.has(x)) next.delete(x); });
  store.mine = next; store.votes[id] = Math.max(0, voteCount(id) + (had?-1:1)); renderAll();
  if(store.mode==="local"){ lsSet(LS_VOTES, JSON.stringify([...next])); return; }
  pendingVote=true;
  try{ await store.db.doc("votes/"+store.uid).set({ideas:[...next], updatedAt:Date.now()}); }
  catch(e){ store.mine.has(id) ? store.mine.delete(id) : store.mine.add(id); store.votes[id]=Math.max(0,voteCount(id)+(had?1:-1));
    flash(denied(e) ? "You can view this board but not vote on it." : "Couldn’t record your vote ("+(e&&e.code||"error")+")."); renderAll(); }
  finally{ pendingVote=false; }
}
function newId(){ return "i"+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
async function saveIdea(idea){
  const body = {text:idea.text, avenues:idea.avenues, dir:idea.dir, tags:idea.tags, createdAt:idea.createdAt, updatedAt:Date.now()};
  const by = idea.createdBy || store.uid; if(by) body.createdBy = by;
  if(shared()){
    try{ await store.db.collection("ideas").doc(idea.id).set(body); }
    catch(e){ flash(denied(e) ? "You don’t have permission to change this idea." : "Couldn’t save ("+(e&&e.code||"error")+"). Your text is still in the box."); return false; }
  } else {
    const i = store.ideas.findIndex(x=>x.id===idea.id); const full = Object.assign({id:idea.id},body);
    if(i>=0) store.ideas[i]=full; else store.ideas.push(full);
    persistLocal(); renderAll();
  }
  return true;
}
async function deleteIdea(id){
  if(shared()){ try{ await store.db.collection("ideas").doc(id).delete(); return true; }catch(e){ flash(denied(e) ? "Only the person who added an idea can delete it." : "Couldn’t delete ("+(e&&e.code||"error")+")"); return false; } }
  store.ideas = store.ideas.filter(x=>x.id!==id); persistLocal(); renderAll(); return true;
}

/* ================= Panel UI ================= */
const ui = {
  selected:null, tab:"avenue", showEmpty: lsGet("tsim-empty")==="1", cutaway: lsGet("tsim-cut")!=="0",
  zones:{carriage:true,person:true,station:true},
  filter:{dir:"all", tag:"all", zone:"all"}, sort:"votes", q:"",
  draft:{text:"", dir:"offer", tags:[], links:[], editing:null}, composerOpen:false, moreOpen:false,
  confirmDel:null, menuOpen:null, filtersOpen:false, mdOut:null, flash:null
};
const ICON = {
  search:'<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>',
  chev:'<svg class="go" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  chevS:'<svg viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="19" cy="12" r="1.4"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h8"/></svg>',
  filter:'<svg viewBox="0 0 24 24"><path d="M4 6h16M7 12h10M10 18h4"/></svg>',
  up:'<svg viewBox="0 0 24 24"><path d="M12 5l7 9H5z"/></svg>'
};
const WHO_COLOR = {offer:"var(--offer)",request:"var(--request)",both:"var(--both)",ambient:"var(--ambient)"};
const WHO_SHORT = {offer:"Offering",request:"Requesting",both:"Both",ambient:"Norm"};
function esc(s){ return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function byVotes(a,b){ return voteCount(b.id)-voteCount(a.id) || b.createdAt-a.createdAt; }
function byNew(a,b){ return b.createdAt-a.createdAt; }
function ideasFor(code){ return store.ideas.filter(i=>i.avenues.includes(code)).sort(byVotes); }
function allTags(){ const s=new Set(PRESET_TAGS); store.ideas.forEach(i=>i.tags.forEach(t=>s.add(t))); return [...s]; }
function topIdeaId(){ let best=null, n=0; store.ideas.forEach(i=>{ const c=voteCount(i.id); if(c>n){ n=c; best=i; } }); return best ? best.id : null; }
let flashTimer=null;
function flash(msg){ ui.flash=msg; renderStatus(); clearTimeout(flashTimer); flashTimer=setTimeout(()=>{ui.flash=null;renderStatus();},4500); }
const panel = document.getElementById("panel");
const plural=(n,w)=>`${n} ${w}${n===1?"":"s"}`;

/* ---- idea card ---- */
function ideaCard(i, ctx){
  const n=voteCount(i.id), me=store.mine.has(i.id), top=topIdeaId()===i.id;
  const label = me ? "Remove your vote" : "Vote for this idea";
  const vote = `<button type="button" class="vote" data-action="vote" data-id="${i.id}" aria-pressed="${me}" ${canVote()?"":"disabled"} title="${label}" aria-label="${label}, ${plural(n,"vote")}">${ICON.up}<b>${n}</b></button>`;

  const tags = i.tags.length ? `<span class="tagtxt">${i.tags.map(t=>"#"+esc(t.replace(/\s+/g,""))).join(" ")}</span>` : "";
  const badges = (top?'<span class="badge top">Top idea</span>':"") + (i.example?'<span class="badge ex">Example</span>':"");
  let menu="", acts="";
  if(canModify(i)){
    const openM = ui.menuOpen===i.id || ui.confirmDel===i.id;
    menu = `<button type="button" class="icon-btn" data-action="menu" data-id="${i.id}" aria-expanded="${openM}" aria-label="${openM?"Close actions":"Edit or delete"}">${ICON.more}</button>`;
    if(ui.confirmDel===i.id) acts = `<div class="acts"><span class="label" style="align-self:center;margin-right:auto">Delete this idea?</span><button type="button" class="btn ghost" data-action="del-no">Keep</button><button type="button" class="btn danger" data-action="del-yes" data-id="${i.id}">Delete</button></div>`;
    else if(ui.menuOpen===i.id) acts = `<div class="acts"><button type="button" class="btn" data-action="edit" data-id="${i.id}">Edit</button><button type="button" class="btn danger" data-action="del" data-id="${i.id}">Delete</button></div>`;
  }
  return `<article class="idea${top?" top1":""}">${vote}
    <div class="body"><p>${esc(i.text)}</p>
      <div class="meta">${badges}<span class="who-l"><i style="background:${WHO_COLOR[i.dir]}"></i>${DIRLABEL[i.dir]}</span>${tags}</div>${also?`<div class="meta">${also}</div>`:""}${acts}</div>

}

/* ---- composer ---- */
function composerHTML(code){
  const d=ui.draft, open=ui.composerOpen||!!d.text||!!d.editing;

  const opts = AVENUES.filter(a=>a.code!==code && !links.includes(a.code)).map(a=>`<option value="${a.code}">${esc(a.name)}</option>`).join("");

          ${linkChips?`<div class="chips">${linkChips}</div>`:""}

        </div></details>

    </div></form>`;
}

/* ---- views ---- */
function avenuesHTML(){
  const q=ui.q.trim().toLowerCase();

function ideasHTML(){

  const active=(f.dir!=="all")+(f.tag!=="all")+(f.zone!=="all");
  const chip=(act,v,l,on)=>`<button type="button" class="chip" data-action="${act}" data-v="${v}" aria-pressed="${on}">${l}</button>`;
  const filters = ui.filtersOpen ? `<div class="filters">

  const nrm=new THREE.Vector3().crossVectors(C.clone().sub(A), B.clone().sub(A));

  if((nrm.dot(out)>0)!==outward){ for(let i=0;i<idx.length;i+=3){ const k=idx[i+1]; idx[i+1]=idx[i+2]; idx[i+2]=k; } }

const ray=new THREE.Raycaster(), mouse=new THREE.Vector2();
let hovered=null; const tip=document.getElementById("tip");
function restore(code){ AV[code].meshes.forEach(m=>{ m.material.emissive.setHex(m.userData.baseEm); m.material.emissiveIntensity=m.userData.baseEi; }); }
function glow(code,hex,i){ AV[code].meshes.forEach(m=>{ m.material.emissive.setHex(hex); m.material.emissiveIntensity=i; }); }
function paint(){ AVENUES.forEach(a=>{ restore(a.code); const n=ideasFor(a.code).length; if(n) glow(a.code,0xE39A10,0.1+0.05*Math.min(n,4)); }); if(hovered && hovered!==ui.selected) glow(hovered,0x6A5410,0.75); if(ui.selected) glow(ui.selected,0xE39A10,0.55); }
const shown=m=>!(m.userData.cut && ui.cutaway);
const vtmp=new THREE.Vector3();
function pick(ev){
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((ev.clientX-r.left)/r.width)*2-1; mouse.y=-((ev.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(pickables.filter(shown),false);
  for(const h of hits){ const m=h.object; if(m.userData.av) return m.userData.av;
    if(m.material.side===THREE.BackSide && h.face){ vtmp.copy(h.face.normal).transformDirection(m.matrixWorld); if(vtmp.dot(ray.ray.direction)<0) continue; }
    return null; }
  return null; }
renderer.domElement.addEventListener("pointermove",ev=>{
  if(ev.pointerType!=="mouse" || ev.buttons) return;
  const code=pick(ev);
  if(code!==hovered){ hovered=code; paint(); }
  renderer.domElement.classList.toggle("hovering",!!code);
  if(code){ const r=stage.getBoundingClientRect(); tip.hidden=false; tip.textContent=`${code} · ${AV[code].name}`; tip.style.left=(ev.clientX-r.left)+"px"; tip.style.top=(ev.clientY-r.top)+"px"; }
  else tip.hidden=true; });
renderer.domElement.addEventListener("pointerleave",()=>{ hovered=null; tip.hidden=true; paint(); });
let downAt=null;
renderer.domElement.addEventListener("pointerdown",ev=>{ downAt=[ev.clientX,ev.clientY]; tip.hidden=true; });
renderer.domElement.addEventListener("pointerup",ev=>{
  if(!downAt) return; const moved=Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1]); downAt=null;
  if(moved>5 || ev.button!==0) return; const code=pick(ev); if(code) select(code,true); });

  paint(); renderPanel(); updateMarkerSel(); panel.scrollTop=0;
  if(code && fly) flyTo(code); }

    else a.el.style.transform=`translate(${(sx-6).toFixed(1)}px,${sy.toFixed(1)}px) translateY(-50%)`;
    a.el.style.zIndex = a.code===ui.selected ? 1000 : (a.el.classList.contains("has")?500:0) + Math.round((1-tmp.z)*400);
    if(checkOcc){ const dir=a.v.clone().sub(camera.position); const dist=dir.length(); occRay.set(camera.position,dir.normalize()); occRay.far=Math.max(0.01,dist-0.08);
      const hit=occRay.intersectObjects(occList,false)[0]; a.el.classList.toggle("dim", !!hit && hit.object.userData.av!==a.code); }
  });
  // stack idea tags so they never overlap; a stem points back to the part
  placed.sort((p,q)=>q.sy-p.sy);
  const rects=[], PH=26;
  placed.forEach(p=>{ const pw=p.a.el.offsetWidth||120; const x0=p.sx-12, x1=x0+pw; let shift=0, y=p.sy, guard=0;
    while(guard++<12 && rects.some(r=>x0<r.x1+4 && x1>r.x0-4 && Math.abs(y-r.y)<PH)){ shift+=PH; y=p.sy-shift; }
    rects.push({x0,x1,y});
    p.a.el.style.transform=`translate(${x0.toFixed(1)}px,${y.toFixed(1)}px) translateY(-50%)`;
    p.a.stem.style.height=shift+"px"; p.a.stem.style.display=shift?"block":"none"; });
}

if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ canvasTex.forEach(c=>{ c.g.clearRect(0,0,c.w,c.h); c.draw(c.g,c.w,c.h); c.t.needsUpdate=true; c.clones.forEach(k=>k.needsUpdate=true); }); });

/* ---- navigation: drag mode, buttons, keys ---- */
function setMode(m){
  ui.mode=m; lsSet("tsim-mode",m);
  document.getElementById("mode-move").setAttribute("aria-pressed",m==="move");
  document.getElementById("mode-rotate").setAttribute("aria-pressed",m==="rotate");
  if(m==="move"){ controls.mouseButtons={LEFT:THREE.MOUSE.PAN,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.ROTATE}; controls.touches={ONE:THREE.TOUCH.PAN,TWO:THREE.TOUCH.DOLLY_ROTATE};
    document.getElementById("hint").textContent="Drag to move · right-drag or Shift-drag to rotate · scroll or pinch to zoom · arrow keys or WASD to walk"; }
  else { controls.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN}; controls.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};
    document.getElementById("hint").textContent="Drag to rotate · right-drag or Shift-drag to move · scroll or pinch to zoom · arrow keys or WASD to walk"; }
}
document.getElementById("mode-move").addEventListener("click",()=>setMode("move"));
document.getElementById("mode-rotate").addEventListener("click",()=>setMode("rotate"));
const held=new Set();
function startHold(k){ held.add(k); tween=null; setPressed(null); }
document.querySelectorAll("[data-hold]").forEach(b=>{
  const k=b.dataset.hold;
  b.addEventListener("pointerdown",e=>{ e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(_){} b.classList.add("held"); startHold(k); });
  const end=()=>{ b.classList.remove("held"); held.delete(k); };
  b.addEventListener("pointerup",end); b.addEventListener("pointercancel",end); b.addEventListener("lostpointercapture",end);
  b.addEventListener("keydown",e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); startHold(k); } });
  b.addEventListener("keyup",e=>{ if(e.key===" "||e.key==="Enter") held.delete(k); });
  b.addEventListener("blur",end);
});
const KEYMAP={ArrowLeft:"left",a:"left",A:"left",ArrowRight:"right",d:"right",D:"right",ArrowUp:"fwd",w:"fwd",W:"fwd",ArrowDown:"back",s:"back",S:"back",q:"turnL",Q:"turnL",e:"turnR",E:"turnR","+":"in","=":"in","-":"out",_:"out"};
function typing(el){ return el && (el.tagName==="INPUT"||el.tagName==="TEXTAREA"||el.tagName==="SELECT"||el.isContentEditable); }
window.addEventListener("keydown",e=>{ if(typing(e.target)||e.metaKey||e.ctrlKey||e.altKey) return; const k=KEYMAP[e.key]; if(!k) return; e.preventDefault(); startHold(k); });
window.addEventListener("keyup",e=>{ const k=KEYMAP[e.key]; if(k) held.delete(k); });
window.addEventListener("blur",()=>held.clear());
const _off=new THREE.Vector3(), _fwd=new THREE.Vector3(), _right=new THREE.Vector3(), _up=new THREE.Vector3(0,1,0);
function stepNav(dt){
  if(!held.size) return;
  _off.copy(camera.position).sub(controls.target); const dist=_off.length();
  camera.getWorldDirection(_fwd); _fwd.y=0; if(_fwd.lengthSq()<1e-6) _fwd.set(0,0,-1); _fwd.normalize();
  _right.crossVectors(_fwd,_up).normalize();
  const sp=Math.max(2.5,dist*0.9)*dt, mv=new THREE.Vector3();
  if(held.has("left")) mv.addScaledVector(_right,-sp);
  if(held.has("right")) mv.addScaledVector(_right,sp);
  if(held.has("fwd")) mv.addScaledVector(_fwd,sp);
  if(held.has("back")) mv.addScaledVector(_fwd,-sp);
  camera.position.add(mv); controls.target.add(mv);
  const turn=(held.has("turnL")?1:0)-(held.has("turnR")?1:0);
  if(turn){ _off.applyAxisAngle(_up,turn*1.3*dt); camera.position.copy(controls.target).add(_off); }
  const z=(held.has("out")?1:0)-(held.has("in")?1:0);
  if(z){ const nd=Math.min(controls.maxDistance,Math.max(controls.minDistance,dist*Math.pow(2.2,z*dt))); _off.setLength(nd); camera.position.copy(controls.target).add(_off); }
}
const BOUNDS={x0:-21,x1:41,y0:-1,y1:9,z0:-4.5,z1:7};
const _c=new THREE.Vector3();
function clampTarget(){ const t=controls.target; _c.set(
  Math.min(BOUNDS.x1,Math.max(BOUNDS.x0,t.x)), Math.min(BOUNDS.y1,Math.max(BOUNDS.y0,t.y)), Math.min(BOUNDS.z1,Math.max(BOUNDS.z0,t.z)));
  if(!_c.equals(t)){ const d=_c.clone().sub(t); t.add(d); camera.position.add(d); } }
ui.mode = lsGet("tsim-mode")==="rotate" ? "rotate" : "move";
setMode(ui.mode);

let W=1,H=1;
function resize(){ W=stage.clientWidth||1; H=stage.clientHeight||1; renderer.setSize(W,H,false); renderer.domElement.style.width="100%"; renderer.domElement.style.height="100%"; camera.aspect=W/H; camera.updateProjectionMatrix(); }
new ResizeObserver(resize).observe(stage);
let lastT=0;
function loop(now){ requestAnimationFrame(loop); const dt=Math.min(0.05,(now-(lastT||now))/1000); lastT=now; if(tween) tween.update(now); else stepNav(dt); controls.update(); clampTarget(); renderer.render(scene,camera); placeMarkers(W,H); }

renderLegend(); applyCut();
setView("overview",true);
resize(); renderAll(); updateMarkerSel(); requestAnimationFrame(loop);
document.getElementById("loading").hidden=true;
window.__tsim={setView,select,camera,controls,scene};
initStore();
})();
</script>
